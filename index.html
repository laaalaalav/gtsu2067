<script>
    // Load data from localStorage or initialize empty array
    let players = JSON.parse(localStorage.getItem('players-happiness-tracker')) || [];
    let winnerNotified = JSON.parse(localStorage.getItem('winner-notified')) || {};

    const interestRate = 0.03;

    function generateId() {
        return Date.now().toString(36) + Math.random().toString(36).substr(2);
    }

    function saveToStorage() {
        localStorage.setItem('players-happiness-tracker', JSON.stringify(players));
        localStorage.setItem('winner-notified', JSON.stringify(winnerNotified));
    }

    function showNotification(message, duration = 3000) {
        const notificationArea = document.getElementById('notificationArea');
        const toast = document.createElement('div');
        toast.className = 'notification-toast';
        toast.textContent = message;
        notificationArea.appendChild(toast);
        setTimeout(() => toast.remove(), duration);
    }

    function calculateNetWorth(player) {
        let cash = player.initialMoney;
        player.transactions.forEach(t => {
            if (t.type === 'money_deposit') cash += t.amount;
            else if (t.type === 'money_withdrawal') cash -= t.amount;
        });
        const locked = (player.activeDeposit && !player.activeDeposit.claimed) ? player.activeDeposit.amount : 0;
        return Math.round((cash + locked) * 100) / 100;
    }

    function calculateCash(player) {
        let cash = player.initialMoney;
        player.transactions.forEach(t => {
            if (t.type === 'money_deposit') cash += t.amount;
            else if (t.type === 'money_withdrawal') cash -= t.amount;
        });
        return Math.round(cash * 100) / 100;
    }

    function calculateLockedMoney(player) {
        return (player.activeDeposit && !player.activeDeposit.claimed) ? player.activeDeposit.amount : 0;
    }

    function calculateCurrentHappiness(player) {
        let total = player.initialHappiness || 0;
        player.transactions.forEach(t => {
            if (t.type === 'happiness_plus') total += 1;
            else if (t.type === 'happiness_minus') total -= 1;
        });
        return total;
    }

    function calculateInterest(amount) {
        return Math.round(amount * interestRate * 100) / 100;
    }

    function findChampion() {
        if (players.length === 0) return null;
        let champion = null;
        let highestMoney = -Infinity;

        players.forEach(player => {
            const netWorth = calculateNetWorth(player);
            const happiness = calculateCurrentHappiness(player);
            if (happiness >= 1 && netWorth > highestMoney) {
                highestMoney = netWorth;
                champion = player;
            }
        });
        return champion;
    }

    function updateChampion() {
        const championContainer = document.getElementById('championContainer');
        const champion = findChampion();
        if (!champion) {
            championContainer.innerHTML = '';
            return;
        }
        const netWorth = calculateNetWorth(champion);
        const happiness = calculateCurrentHappiness(champion);

        championContainer.innerHTML = `
            <div class="champion-section">
                <div class="champion-title">🏆 TOP PLAYER 🏆</div>
                <div class="champion-name">${escapeHtml(champion.name)}</div>
                <div class="champion-stats">
                    <span>💰 $${netWorth.toFixed(2)}</span>
                    <span>😆 ${'😆'.repeat(Math.min(happiness, 5))} ${happiness}</span>
                </div>
            </div>
        `;
    }

    function checkForWinner(player) {
        const netWorth = calculateNetWorth(player);
        const happiness = calculateCurrentHappiness(player);
        if (netWorth >= 100000 && happiness >= 3 && !winnerNotified[player.id]) {
            winnerNotified[player.id] = true;
            saveToStorage();
            const winnerDiv = document.getElementById('winnerAnnouncement');
            const winnerMessage = document.getElementById('winnerMessage');
            winnerDiv.style.display = 'block';
            winnerMessage.innerHTML = `${escapeHtml(player.name)} has reached $100k with ${happiness} 😆!`;
            showNotification(`🎉 ${player.name} WON! $100k + 3 😆`, 5000);
            return true;
        }
        return false;
    }

    function checkAllPlayersForWinner() {
        for (let player of players) {
            if (checkForWinner(player)) break;
        }
    }

    function renderPlayers() {
        const container = document.getElementById('playersContainer');
        container.innerHTML = '';

        if (players.length === 0) {
            container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: white; padding: 40px;">No players yet. Add your first player above!</div>';
            updateChampion();
            document.getElementById('winnerAnnouncement').style.display = 'none';
            return;
        }

        const champion = findChampion();
        players.forEach((player, index) => {
            const playerCard = createPlayerCard(player, index, champion);
            container.appendChild(playerCard);
        });

        updateChampion();
        checkAllPlayersForWinner();
    }

    function createPlayerCard(player, index, champion) {
        const card = document.createElement('div');
        card.className = 'player-card';
        if (champion && champion.id === player.id) card.classList.add('leader');
        if (player.activeDeposit && !player.activeDeposit.claimed) card.classList.add('has-deposit');

        const cash = calculateCash(player);
        const netWorth = calculateNetWorth(player);
        const lockedMoney = calculateLockedMoney(player);
        const currentHappiness = calculateCurrentHappiness(player);
        const isWinner = netWorth >= 100000 && currentHappiness >= 3;

        // Recent transactions
        let transactionsHtml = '';
        player.transactions.slice(-5).reverse().forEach(t => {
            const date = new Date(t.timestamp).toLocaleString();
            let transactionClass = '', icon = '', text = '';

            if (t.type === 'money_deposit') {
                transactionClass = 'money';
                icon = '💰 +';
                text = `$${t.amount.toFixed(2)}`;
            } else if (t.type === 'money_withdrawal') {
                transactionClass = 'money withdrawal';
                icon = '💰 -';
                text = `$${t.amount.toFixed(2)}`;
            } else if (t.type === 'happiness_plus') {
                transactionClass = 'happiness';
                icon = '😆 +1';
            } else if (t.type === 'happiness_minus') {
                transactionClass = 'happiness minus';
                icon = '😆 -1';
            } else if (t.type === 'time_deposit') {
                transactionClass = 'deposit';
                icon = '⏰ 🔒';
                text = `$${t.amount.toFixed(2)} locked`;
            } else if (t.type === 'interest_earned') {
                transactionClass = 'interest';
                icon = '⏰ ✨';
                text = `+$${t.amount.toFixed(2)}`;
            }

            transactionsHtml += `
                <div class="transaction-item ${transactionClass}">
                    <span>${icon}</span>
                    <span>${text}</span>
                    <span>${date}</span>
                </div>
            `;
        });

        // Time deposit section
        let timeDepositHtml = player.activeDeposit && !player.activeDeposit.claimed ? `
            <div class="time-deposit-section">
                <div class="time-deposit-title">⏰ Time Deposit (3%)</div>
                <div class="active-deposit">
                    <div class="deposit-details">
                        <span class="deposit-amount">🔒 $${player.activeDeposit.amount.toFixed(2)}</span>
                        <span class="deposit-time">1 Month</span>
                        <span class="deposit-interest">Will earn: $${calculateInterest(player.activeDeposit.amount).toFixed(2)}</span>
                    </div>
                    <div class="deposit-status">⏳ PENDING - Not yet matured</div>
                    <div class="deposit-actions">
                        <button class="claim-btn" onclick="claimTimeDeposit(${index})">💰 Claim $${(player.activeDeposit.amount + calculateInterest(player.activeDeposit.amount)).toFixed(2)}</button>
                    </div>
                </div>
            </div>
        ` : `
            <div class="time-deposit-section">
                <div class="time-deposit-title">⏰ Start Time Deposit (3%)</div>
                <div class="deposit-inputs">
                    <input type="number" id="deposit-amount-${index}" placeholder="Enter amount" step="0.01" min="1">
                </div>
                <button class="time-deposit-btn" onclick="createTimeDeposit(${index})" style="width: 100%; margin-top: 10px;">🔒 Lock Money for 1 Month</button>
            </div>
        `;

        const leaderBadge = (champion && champion.id === player.id) ? '<div class="leader-badge">🏆 TOP PLAYER 🏆</div>' : '';
        const depositBadge = (player.activeDeposit && !player.activeDeposit.claimed) ? '<div class="deposit-badge">⏰ LOCKED</div>' : '';

        card.innerHTML = `
            ${leaderBadge}
            ${depositBadge}
            <div class="player-header">
                <div class="player-name">${escapeHtml(player.name)} ${isWinner ? '🏆' : ''}</div>
            </div>
            <div class="stats-display">
                <div class="money-display">
                    <div class="net-worth-label">💰 Net Worth:</div>
                    <div class="net-worth-amount">$${netWorth.toFixed(2)}</div>
                    <div class="separator"></div>
                    <div class="cash-info">Cash: $${cash.toFixed(2)}</div>
                    <div class="locked-info">Locked: $${lockedMoney.toFixed(2)}</div>
                </div>
                <div class="happiness-display">
                    <div class="current-happiness">${'😆'.repeat(Math.min(currentHappiness, 5))} ${currentHappiness}</div>
                    <div class="initial-value">Initial: ${player.initialHappiness} 😆</div>
                </div>
            </div>
            ${timeDepositHtml}
            <div class="money-inputs">
                <input type="number" id="money-amount-${index}" placeholder="Enter amount" step="0.01" min="0">
            </div>
            <div class="money-buttons">
                <button class="money-btn" onclick="addMoneyTransaction(${index}, 'deposit')">💰 Add Money</button>
                <button class="money-btn" onclick="addMoneyTransaction(${index}, 'withdrawal')">💰 Take Money</button>
            </div>
            <div class="happiness-buttons">
                <button class="happiness-btn" onclick="addHappiness(${index}, 'plus')">😆 +1</button>
                <button class="happiness-btn minus" onclick="addHappiness(${index}, 'minus')">😆 -1</button>
            </div>
            <div class="transaction-history">
                <h4 style="margin-bottom: 5px; color: #333;">Recent Activity:</h4>
                ${transactionsHtml || '<div style="color: #999;">No transactions yet</div>'}
            </div>
            <div style="margin-top: 15px; display: flex; gap: 10px;">
                <button class="delete-btn" onclick="clearTransactions(${index})" style="flex: 1;">Clear History</button>
                <button class="delete-btn" onclick="deletePlayer(${index})" style="flex: 1;">Delete Player</button>
            </div>
        `;
        return card;
    }

    function escapeHtml(unsafe) {
        return unsafe.replace(/[&<>]/g, m => ({'&': '&amp;', '<': '&lt;', '>': '&gt;'})[m]);
    }

    // ==================== FIXED FUNCTION ====================
    function addHappiness(playerIndex, change) {
        if (playerIndex < 0 || playerIndex >= players.length) return;

        const player = players[playerIndex];
        const currentHappiness = calculateCurrentHappiness(player);

        if (change === 'minus') {
            if (currentHappiness - 1 < 0) {
                if (!confirm(`Happiness will become negative (${currentHappiness - 1}). Continue?`)) {
                    return;
                }
            }
        }

        players[playerIndex].transactions.push({
            type: `happiness_${change}`,
            timestamp: new Date().toISOString()
        });

        saveToStorage();
        renderPlayers();
    }
    // =======================================================

    // Rest of your functions (unchanged except minor safety improvements)
    function addPlayer() {
        const name = document.getElementById('playerName').value.trim();
        const initialMoney = parseFloat(document.getElementById('initialMoney').value) || 0;
        const initialHappiness = parseInt(document.getElementById('initialHappiness').value) || 0;

        if (!name) {
            alert('Please enter a player name');
            return;
        }

        players.push({
            id: generateId(),
            name: name,
            initialMoney: initialMoney,
            initialHappiness: initialHappiness,
            transactions: [],
            activeDeposit: null,
            createdAt: new Date().toISOString()
        });

        saveToStorage();
        renderPlayers();
        showNotification(`✨ Player "${name}" added!`, 2000);

        // Clear inputs
        document.getElementById('playerName').value = '';
        document.getElementById('initialMoney').value = '';
        document.getElementById('initialHappiness').value = '0';
    }

    function addMoneyTransaction(playerIndex, type) {
        if (playerIndex < 0 || playerIndex >= players.length) return;
        const amount = parseFloat(document.getElementById(`money-amount-${playerIndex}`).value);
        if (!amount || amount <= 0) {
            alert('Please enter a valid positive amount');
            return;
        }

        const player = players[playerIndex];
        const cash = calculateCash(player);

        if (type === 'withdrawal' && cash - amount < 0) {
            if (!confirm('This will make cash negative. Continue?')) return;
        }

        player.transactions.push({
            type: `money_${type}`,
            amount: amount,
            timestamp: new Date().toISOString()
        });

        saveToStorage();
        renderPlayers();
        document.getElementById(`money-amount-${playerIndex}`).value = '';
    }

    function createTimeDeposit(playerIndex) {
        if (playerIndex < 0 || playerIndex >= players.length) return;
        // ... (your existing createTimeDeposit function - unchanged)
        const amount = parseFloat(document.getElementById(`deposit-amount-${playerIndex}`).value);
        if (!amount || amount <= 0) {
            alert('Please enter a valid positive amount');
            return;
        }
        const player = players[playerIndex];
        const cash = calculateCash(player);
        if (amount > cash) {
            alert(`Insufficient cash! Available: $${cash.toFixed(2)}`);
            return;
        }
        if (player.activeDeposit && !player.activeDeposit.claimed) {
            alert('You already have an active time deposit!');
            return;
        }

        player.activeDeposit = {
            amount: amount,
            claimed: false,
            createdAt: new Date().toISOString()
        };

        player.transactions.push({ type: 'money_withdrawal', amount: amount, timestamp: new Date().toISOString() });
        player.transactions.push({ type: 'time_deposit', amount: amount, timestamp: new Date().toISOString() });

        saveToStorage();
        renderPlayers();
        document.getElementById(`deposit-amount-${playerIndex}`).value = '';
        showNotification(`🔒 Locked $${amount.toFixed(2)} for 1 Month at 3%`, 2000);
    }

    function claimTimeDeposit(playerIndex) {
        if (playerIndex < 0 || playerIndex >= players.length) return;
        const player = players[playerIndex];
        if (!player.activeDeposit || player.activeDeposit.claimed) return;

        const deposit = player.activeDeposit;
        const interest = calculateInterest(deposit.amount);
        const total = deposit.amount + interest;

        player.transactions.push({ type: 'money_deposit', amount: total, timestamp: new Date().toISOString() });
        player.transactions.push({ type: 'interest_earned', amount: interest, timestamp: new Date().toISOString() });

        player.activeDeposit.claimed = true;
        player.activeDeposit = null;

        saveToStorage();
        renderPlayers();
        showNotification(`✨ Claimed $${total.toFixed(2)} (+$${interest.toFixed(2)} interest)!`, 3000);
    }

    function deletePlayer(index) {
        if (index < 0 || index >= players.length) return;
        if (confirm(`Delete player ${players[index].name}?`)) {
            const name = players[index].name;
            players.splice(index, 1);
            saveToStorage();
            renderPlayers();
            showNotification(`👋 Player "${name}" removed`, 2000);
        }
    }

    function clearTransactions(index) {
        if (index < 0 || index >= players.length) return;
        if (confirm('Clear all transactions and deposits for this player?')) {
            players[index].transactions = [];
            players[index].activeDeposit = null;
            saveToStorage();
            renderPlayers();
            showNotification('🧹 Transactions cleared', 2000);
        }
    }

    function resetAllData() {
        if (confirm('Reset ALL data? This cannot be undone!')) {
            players = [];
            winnerNotified = {};
            saveToStorage();
            renderPlayers();
            document.getElementById('winnerAnnouncement').style.display = 'none';
            showNotification('🔄 All data reset', 2000);
        }
    }

    // Initialize
    renderPlayers();
</script>
